<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fungi Booklet 方吉小冊</title>
<!--
  這一頁只做一件事：把人送到 app.nature-booklets.cc。

  方吉小冊的網站 2026-08 搬到 Cloudflare Pages（原因見 fungibooklet repo 的
  docs/r2-cdn-migration.md）。舊站留著只為了讓已經流傳出去的連結還能用。
-->
<link rel="canonical" href="https://app.nature-booklets.cc/">
<script>
  // 舊站（GitHub Pages）→ 新站（Cloudflare Pages）的轉址。
  //
  // ★★ 為什麼是用戶端做，不是 301：*.github.io 沒有任何轉址規則可設，也不能把
  //    Cloudflare 掛在它前面（那是 GitHub 的網域）。所以只能 JS ＋ meta refresh，
  //    Google 會把「0 秒的 meta refresh」當成軟性 301。代價是 Search Console 的
  //    「變更網址」工具用不了——那個工具硬性要求真的 301。
  //
  // ★★ 舊站的深連結長這樣：/s/<name>。GitHub Pages 沒有 SPA fallback，所以它用
  //    rafgraph/spa-github-pages 那套：404.html 把 /s/X 編成 /?/s/X 丟回首頁，
  //    index.html 再還原。兩個入口都要接：
  //      * 404.html —— 深連結第一手落點，pathname 還是原樣。
  //      * index.html —— 直接進首頁，**以及**那個 /?/ 編碼形式（瀏覽器可能還
  //        快取著舊的 404.html；而且舊站 sitemap 裡 3357 筆全是編碼形式）。
  var l = window.location;
  var NEW_ORIGIN = 'https://app.nature-booklets.cc';
  var target = l.pathname + l.search + l.hash;
  if (l.search && l.search[1] === '/') {
    // 解碼邏輯照抄舊 index.html 的還原碼，才跟編碼端對得起來。
    var decoded = l.search.slice(1).split('&').map(function (s) {
      return s.replace(/~and~/g, '&');
    }).join('?');
    target = l.pathname.slice(0, -1) + decoded + l.hash;
  }
  var url = NEW_ORIGIN + target;

  // 讓爬蟲看得到這一頁對應到新站的哪一個網址。
  try {
    var c = document.createElement('link');
    c.rel = 'canonical';
    c.href = url;
    document.head.appendChild(c);
  } catch (e) {}

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  // ★★ 舊站是 Flutter web app，裝過 service worker。它對 index.html 是
  //    onlineFirst，所以線上的人拿得到這頁；但**新的 index.html 不再載入
  //    flutter_bootstrap.js，也就不會再呼叫 register()**——那個 SW 會就這樣
  //    永遠留在使用者的瀏覽器裡，連同幾 MB 的快取。所以這裡自己把它退掉。
  //
  // ★ 只有真的有註冊過才等；沒有 SW 的訪客（含爬蟲）直接跳，不要為了清理
  //   多花任何時間。
  (function () {
    function go() { l.replace(url); }
    if (!('serviceWorker' in navigator)) { go(); return; }
    Promise.race([navigator.serviceWorker.getRegistrations(), sleep(200).then(function () { return []; })])
      .then(function (rs) {
        if (!rs || !rs.length) return;
        var jobs = rs.map(function (r) { return r.unregister(); });
        if (window.caches) {
          jobs.push(caches.keys().then(function (ks) {
            return Promise.all(ks.map(function (k) { return caches.delete(k); }));
          }));
        }
        return Promise.race([Promise.all(jobs), sleep(400)]);
      })
      .catch(function () {})
      .then(go, go);
  })();
</script>
<!-- 沒有 JS 時的退路。★ 只能送到首頁——這裡是靜態 HTML，接不到路徑。 -->
<meta http-equiv="refresh" content="0; url=https://app.nature-booklets.cc/">
<style>
  body { font: 16px/1.7 system-ui, -apple-system, "Noto Sans TC", sans-serif;
         margin: 0; padding: 3rem 1.5rem; text-align: center; color: #1c1c20; }
  a { color: #1d6f42; }
</style>
</head>
<body>
<!--
  ★ 三種語言全部列出來，不是用 navigator.language 挑一個。

  會看到這段文字的前提是「JS 沒有跑」——而挑語言的程式本身也要 JS。用 JS 挑
  語言的版本在這裡永遠不會生效，等於自我矛盾的裝飾。三行都印出來難看，但不
  依賴任何條件。轉址頁的 body 只在一切都失敗時才會被看見，那個時刻要的是可靠。
-->

<p lang="zh-Hans"><a href="https://app.nature-booklets.cc/">方吉小册已搬到 app.nature-booklets.cc</a></p>
<p lang="en"><a href="https://app.nature-booklets.cc/">Fungi Booklet has moved to app.nature-booklets.cc</a></p>
</body>
</html>
